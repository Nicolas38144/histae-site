server {
    listen 80 default_server;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Redirection immédiate selon la préférence du navigateur ; le client Next
    # applique le même repli si le site est servi sans Nginx (développement).
    location = / {
        if ($http_accept_language ~* "^en") { return 302 /en/; }
        if ($http_accept_language ~* "^es") { return 302 /es/; }
        if ($http_accept_language ~* "^it") { return 302 /it/; }
        return 302 /fr/;
    }

    # Export statique Next.js : seules les pages construites sont servies.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Les médias publics conservent un cache court : og.png et logo.png peuvent être remplacés sans URL versionnée.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?|eot|ttf|otf|webmanifest)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; manifest-src 'self'" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # La CSP conserve unsafe-inline pour l'hydratation de l'export Next statique.
    # Lors d'un passage à un runtime Next côté serveur, la remplacer par une CSP à nonce.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; manifest-src 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
}
