server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single Page Application fallback
    location / {
        try_files $uri /index.html;
    }

    # Fichiers statiques (JS, CSS, images) avec cache navigateur
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|eot|ttf|otf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Optionnel : compression gzip pour réduire la taille des fichiers envoyés
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Headers de sécurité basiques (facultatif mais recommandé)
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
}