allowBuilds:
  unrs-resolver: true
  "@parcel/watcher": true
  "@swc/core": true

# Security floor for the PostCSS source-map dependency; allow newer patched versions.
overrides:
  "source-map-js@<1.2.2": 1.2.2
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "brace-expansion@>=1.0.0 <1.1.21": 1.1.21
  "brace-expansion@>=5.0.0 <5.0.12": 5.0.12
